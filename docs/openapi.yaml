openapi: 3.1.0
info:
  title: SplitWise+ FastAPI
  version: 1.1.0
  description: FastAPI service for authenticated mobile workflows, financial replay, groups, reports, and CSV export.
servers:
  - url: /api/v1
paths:
  /auth/register: { post: { summary: Register and start a session } }
  /auth/login: { post: { summary: Log in } }
  /auth/logout: { post: { summary: Log out } }
  /auth/recovery/request: { post: { summary: Request account recovery } }
  /auth/recovery/confirm: { post: { summary: Confirm account recovery } }
  /me: { get: { summary: Current user } }
  /groups: { get: { summary: List groups }, post: { summary: Create group } }
  /groups/{id}/members: { post: { summary: Add an existing registered user } }
  /groups/{id}/join-codes: { post: { summary: Create an expiring owner-controlled join code } }
  /groups/join: { post: { summary: Join through a valid code } }
  /groups/{id}/archive: { post: { summary: Archive a group } }
  /groups/{id}/expenses: { post: { summary: Post an expense, requires Idempotency-Key } }
  /groups/{id}/expenses/{eventId}/corrections: { post: { summary: Reverse and replace an expense, requires Idempotency-Key } }
  /groups/{id}/settlements: { post: { summary: Record a settlement, requires Idempotency-Key } }
  /groups/{id}/balances: { get: { summary: Read current balances } }
  /groups/{id}/settlement-suggestions: { get: { summary: Calculate deterministic debt suggestions } }
  /groups/{id}/history: { get: { summary: Read chronological event history } }
  /groups/{id}/history/search: { get: { summary: Search history with bounded pagination } }
  /groups/{id}/explanations: { get: { summary: Explain member balance contributions } }
  /groups/{id}/presets: { get: { summary: List presets }, post: { summary: Create a validated split preset } }
  /groups/{id}/reports/monthly: { get: { summary: Return monthly JSON or CSV report } }
