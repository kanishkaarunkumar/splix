name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: splix_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SPLIX_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/splix_test
      MIGRATION_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/splix_test
      DATABASE_URL: postgresql://splix_api:runtime-test-only@localhost:5432/splix_test
      SPLIX_TEST_RUNTIME_DATABASE_URL: postgresql://splix_api:runtime-test-only@localhost:5432/splix_test
      PGPASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Fresh database and runtime grants
        run: |
          python -m app.migrate
          python -m app.migrate
          for file in db/seeds/*.sql db/tests/financial_invariants.sql db/tests/runtime_privileges.sql; do
            psql "$SPLIX_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: pytest -q
      - run: ruff check app tests && ruff format --check app tests
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.31.0'
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm build
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
      - run: pnpm --dir apps/mobile exec expo export --platform android --output-dir .dist/android
  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.31.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: pnpm --dir apps/mobile install --frozen-lockfile
      - run: pnpm --dir apps/mobile prebuild --no-install
      - run: ./gradlew :app:assembleDebug :splix-capture:testDebugUnitTest --no-daemon
        working-directory: apps/mobile/android
